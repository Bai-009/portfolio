<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Co-Thinker · 思考空间</title><link rel="stylesheet" href="studio.css"></head>
<body>
<div class="application">
  <header class="app-header"><div class="brand-group"><button class="icon-button" id="historyToggle" aria-label="打开会话历史" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12"/></svg></button><a class="wordmark" href="./">Co-Thinker</a></div><span class="session-title">记录灵感</span><nav class="session-nav" aria-label="会话视图"><button class="foundation-entry" id="foundationToggle" aria-pressed="false" aria-controls="foundationView">地基</button></nav></header>
  <aside class="history" id="history" aria-label="会话历史" hidden><div class="history-title">会话历史<button class="icon-button" id="historyClose" aria-label="关闭会话历史">×</button></div><button class="history-item" id="currentSession"><span>记录灵感</span><small>当前示例</small></button><p>这份样张只包含一段讨论。</p></aside>
  <main id="reading" class="reading" aria-label="思考内容">
    <section id="conversation" class="conversation" aria-label="讨论"><div id="messages"></div><div id="localNotice" class="local-notice" role="status" hidden></div></section>
    <section id="foundationView" class="document-view" aria-labelledby="foundationTitle" hidden><div class="view-heading"><button class="back" data-back>← 返回讨论</button></div><h1 id="foundationTitle" tabindex="-1">地基</h1><p class="document-lead" id="foundationNarrative"></p><div id="foundationDetails"></div><div class="document-actions"><button class="text-action" id="makeManuscript">形成手稿 <span aria-hidden="true">↗</span></button></div></section>
    <section id="manuscriptView" class="document-view manuscript" aria-labelledby="manuscriptTitle" hidden><div class="view-heading"><button class="back" data-back>← 返回讨论</button><div class="document-tools"><button id="copyBrief">复制</button><button id="downloadBrief">下载 Markdown</button></div></div><p class="manuscript-date">2026年9月20日 · 示例手稿</p><h1 id="manuscriptTitle" tabindex="-1">灵感的记录与回访</h1><div id="manuscriptBody"></div><p class="snapshot-note" id="snapshotNote"></p></section>
  </main>
  <footer class="dock" id="dock"><div class="compose-box"><div class="quote-composer" id="quoteComposer" hidden><span id="quoteText"></span><button id="clearQuote" aria-label="取消引用">×</button></div><div class="compose-row"><label for="draft" class="sr-only">继续思考</label><textarea id="draft" rows="1" placeholder="输入消息…" aria-describedby="inputHelp"></textarea><button class="send" id="send" aria-label="发送内容" title="发送 · Enter；Shift + Enter 换行" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="3.8" cy="12" r=".8" fill="currentColor" stroke="none"/><path d="M4.8 12 Q 11 11.5 19.2 12 M15 7.9 L19.4 12 L15 16.1"/></svg></button></div><span id="inputHelp" class="sr-only">Enter 发送，Shift 加 Enter 换行。示例回应播放时仍可输入并发送补充。</span></div><details class="preview-tools" id="previewTools"><summary>交互预览 · <span id="sampleState">未连接模型</span></summary><div class="preview-panel"><p id="previewState">此页面使用预设对话，输入不会发送给模型。</p><button id="advance">填入下一句示例 →</button><button id="reset">重新开始</button></div></details></footer>
</div><script src="studio.js"></script></body></html>
