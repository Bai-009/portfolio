<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模块化功能职责重构</title>
<style>
:root {
  --font-display: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --graphite: #1f2e46;
  --soft-graphite: rgba(31, 46, 70, .78);
  --glass: rgba(255, 255, 255, .36);
  --glass-border: rgba(255, 255, 255, .58);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  margin: 0;
  color: rgba(255, 255, 255, .86);
  font: 13.5px/1.68 var(--font-ui);
  overflow-x: hidden;
}

.ambient-bg {
  position: fixed;
  inset: 0;
  z-index: -3;
  background-image: url("assets/hero-nature-bg.png");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

.ambient-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(120,160,205,.07), transparent 18%, transparent 82%, rgba(120,160,205,.07)),
    linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.015) 42%, rgba(255,255,255,.11));
  pointer-events: none;
}

button { font: inherit; color: inherit; }

.brand-page {
  position: relative;
  min-height: 100vh;
  width: min(1380px, calc(100vw - 48px));
  margin: 0 auto;
  padding: 20px 0 42px;
}

.top-nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 8px 0 12px;
  gap: 24px;
}

.brand-mark {
  font: 600 20px/1 var(--font-display);
  letter-spacing: -.2px;
  color: rgba(255,255,255,.95);
  justify-self: start;
}

.nav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  justify-self: center;
}

.nav-links button {
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.9);
  cursor: pointer;
  font-weight: 500;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 6px;
  transition: all .15s ease;
}

.nav-links button:hover {
  color: #fff;
  background: rgba(255,255,255,.12);
}

.nav-cta {
  justify-self: end;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.16);
  color: rgba(255,255,255,.96);
  cursor: pointer;
  padding: 7px 16px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 999px;
  transition: all .18s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 4px 16px rgba(20,35,60,.08);
  backdrop-filter: blur(10px) saturate(1.12);
}

.nav-cta:hover {
  background: rgba(255,255,255,.25);
  transform: translateY(-1px);
}

.hero {
  position: relative;
  text-align: center;
  padding: 72px 20px 32px;
  min-height: 380px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 620px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  opacity: .85;
  margin-bottom: 10px;
  color: rgba(255,255,255,.92);
}

.hero h1 {
  font: 700 44px/1.02 var(--font-display);
  margin: 0 0 20px;
  letter-spacing: -.6px;
  color: rgba(255,255,255,.98);
  text-shadow:
    0 2px 20px rgba(20, 40, 70, .38),
    0 1px 3px rgba(20, 40, 70, .22);
}



.hero-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 8px;
}

.hero-action {
  min-width: 160px;
  border: 0;
  background: rgba(255,255,255,.85);
  color: #1f2e46;
  cursor: pointer;
  padding: 11px 22px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .3px;
  border-radius: 999px;
  transition: all .2s cubic-bezier(0.2, 0, 0, 1);
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.hero-action:hover {
  background: #fff;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.hero-action.secondary {
  background: rgba(255,255,255,.18);
  color: rgba(255,255,255,.95);
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.modules-section {
  margin-top: 12px;
  padding: 24px 12px 36px;
  position: relative;
  background: transparent;
}

.sequence-section {
  margin: 0 auto 18px;
  padding: 8px 12px 6px;
}

.sequence-shell {
  max-width: 1080px;
  margin: 0 auto;
  border: 1px solid rgba(200,215,235,.45);
  background: rgba(255,255,255,.48);
  border-radius: 18px;
  box-shadow: 0 5px 18px rgba(30,50,90,.08);
  overflow: hidden;
  color: var(--graphite);
}

.sequence-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 18px 8px;
  border-bottom: 1px solid rgba(31,46,70,.08);
  background: rgba(255,255,255,.34);
}

.sequence-top h2 {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -.1px;
  color: #172235;
}

.sequence-top p {
  margin: 3px 0 0;
  color: #3c506b;
  font-size: 11.8px;
  line-height: 1.45;
}

.sequence-hint {
  font-size: 11.5px;
  color: #526986;
  white-space: nowrap;
}

.sequence-scroll {
  overflow-x: auto;
  padding: 12px 14px;
}

.sequence-track {
  display: flex;
  gap: 8px;
  min-width: 980px;
  align-items: center;
}

.sequence-step {
  position: relative;
  min-width: 104px;
  flex: 1 0 104px;
  border: 1px solid rgba(185,202,226,.45);
  background: rgba(255,255,255,.58);
  border-radius: 999px;
  padding: 8px 10px;
  cursor: pointer;
  color: #243955;
  display: grid;
  grid-template-columns: 24px 1fr;
  align-items: center;
  gap: 7px;
  text-align: left;
  transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}

.sequence-step::after {
  content: "";
  position: absolute;
  top: 50%;
  right: -9px;
  width: 10px;
  height: 1px;
  background: rgba(54,77,108,.3);
}

.sequence-step:last-child::after { display: none; }

.sequence-step:hover {
  background: rgba(255,255,255,.8);
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(30,50,90,.08);
}

.sequence-step.active {
  background: rgba(255,255,255,.9);
  border-color: rgba(58,84,122,.42);
  box-shadow: 0 6px 16px rgba(30,50,90,.12);
}

.sequence-no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: rgba(50,84,130,.09);
  color: #253a58;
  font-size: 11px;
  font-weight: 700;
}

.sequence-title {
  font-size: 12.2px;
  line-height: 1.22;
  font-weight: 700;
  color: #172235;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sequence-detail {
  display: none;
  margin: 0 14px 14px;
  padding: 13px 15px;
  border-radius: 14px;
  background: rgba(255,255,255,.76);
  border: 1px solid rgba(185,202,226,.44);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}

.sequence-detail.open { display: block; }

.sequence-detail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 10px;
}

.sequence-detail h3 {
  margin: 0;
  font-size: 14px;
  line-height: 1.25;
  color: #172235;
}

.sequence-detail-modules {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.sequence-detail-modules span {
  font-size: 10.5px;
  line-height: 1;
  padding: 5px 7px;
  border-radius: 999px;
  background: #edf3fa;
  color: #2d4667;
}

.sequence-detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.sequence-detail-grid p {
  margin: 0;
  color: #33465f;
  font-size: 12px;
  line-height: 1.45;
}

.sequence-detail-grid em {
  display: block;
  font-style: normal;
  font-size: 10.5px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: .9px;
  color: #657a96;
  margin-bottom: 3px;
}

.sequence-note {
  display: none;
  padding: 0 18px 13px;
  color: #435772;
  font-size: 12.2px;
}

.section-head {
  text-align: center;
  margin-bottom: 16px;
}

.cloud-label {
  font-size: 11px;
  letter-spacing: 2.5px;
  margin-bottom: 6px;
  text-transform: uppercase;
  color: #2f425c;
  text-shadow: 0 1px 4px rgba(255,255,255,.6);
}

.section-desc {
  max-width: 560px;
  margin: 0 auto;
  font-size: 13.5px;
  color: #2f425c;
  text-shadow: 0 1px 4px rgba(255,255,255,.5);
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(260px, 1fr));
  gap: 16px;
  max-width: 1080px;
  margin: 0 auto;
}

@media (max-width: 860px) {
  .module-grid { grid-template-columns: repeat(2, minmax(240px, 1fr)); }
}
@media (max-width: 520px) {
  .module-grid { grid-template-columns: 1fr; gap: 14px; }
}

.module-pill {
  background: rgba(255,255,255,.68);
  border: 1px solid rgba(200,215,235,.38);
  border-radius: 16px;
  padding: 15px 17px;
  text-align: left;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, background .16s;
  display: flex;
  flex-direction: column;
  box-shadow: 0 2px 10px rgba(30,50,90,.08);
}

.module-pill:hover {
  background: rgba(255,255,255,.82);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(30,50,90,.12);
  border-color: rgba(180,200,225,.5);
}

.module-pill.active {
  background: rgba(255,255,255,.88);
  border-color: #4d6b94;
  box-shadow: 0 3px 12px rgba(30,50,90,.15);
}

.module-pill small {
  display: block;
  font-size: 10.5px;
  color: #3f5269;
  letter-spacing: .8px;
  margin-bottom: 2px;
}

.module-pill b {
  display: block;
  font-size: 14.5px;
  line-height: 1.32;
  font-weight: 650;
  color: #16202e;
  margin: 4px 0 6px;
  overflow-wrap: break-word;
}

.module-pill span {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 12.5px;
  color: #34465c;
  line-height: 1.35;
}

/* ===== Backdrop & Modals ===== */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 28, 52, .22);
  z-index: 60;
  display: none;
}

.backdrop.open { display: block; }

.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 70;
  display: none;
  flex-direction: column;
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(200, 215, 235, .6);
  border-radius: 20px;
  box-shadow: 0 20px 70px rgba(30, 50, 90, .22);
  overflow: hidden;
  color: var(--graphite);
}

.modal.open { display: flex; }

.module-modal { width: min(720px, 94vw); max-height: 78vh; }

.module-modal .modal-head { padding: 22px 26px 12px; border-bottom: 1px solid rgba(31,46,70,.08); }

.module-modal .modal-kicker {
  display: flex; gap: 8px; font-size: 11px; color: var(--soft-graphite); margin-bottom: 3px;
}

.module-modal .modal-kicker span {
  background: rgba(31,46,70,.07); padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
}

.module-modal h2 { margin: 0; font-size: 17.5px; line-height: 1.25; font-weight: 650; color: var(--graphite); }

.module-modal .purpose { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--soft-graphite); }

.modal-close {
  position: absolute; top: 14px; right: 16px; width: 28px; height: 28px;
  border: 0; background: transparent; font-size: 24px; line-height: 1; color: #475a75;
  cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(31,46,70,.06); }

.modal-tabs {
  display: flex; gap: 4px; padding: 0 18px;
  border-bottom: 1px solid rgba(31,46,70,.07);
  background: #f3f7fc;
}

.modal-tab {
  border: 0; background: transparent; padding: 10px 14px; font-size: 12.5px; font-weight: 600;
  color: var(--graphite); opacity: .65; cursor: pointer;
}
.modal-tab.active { opacity: 1; background: #fff; border-radius: 8px 8px 0 0; }

.modal-body {
  padding: 18px 26px; overflow: auto; flex: 1;
  font-size: 13.5px; line-height: 1.55;
  background: #fff;
}
.modal-body h3 {
  font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase;
  color: #4a5f7a; margin: 0 0 5px; font-weight: 600;
}
.modal-body p { margin: 0 0 10px; color: #2e4058; }

.key-functions { display: flex; flex-direction: column; gap: 5px; }
.key-functions span { background: #f3f7fc; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: #2e4058; }

.full-list { display: flex; flex-wrap: wrap; gap: 5px; }
.full-list span { background: #f3f7fc; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; }

.io-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.pill-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.light-pill { background: #f0f4f9; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: #3b506e; }

.data-modal { width: min(1120px, 94vw); max-height: 74vh; }

.data-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 22px; border-bottom: 1px solid rgba(31,46,70,.08); flex-shrink: 0;
  background: #f8fafd;
}
.data-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--graphite); }

.data-tabs { display: flex; gap: 6px; align-items: center; }

.table-area {
  flex: 1;
  overflow: auto;
  overflow-x: auto;
  padding: 0;
  background: rgba(246, 250, 255, .92);
}

.data-modal table {
  table-layout: fixed;
  width: 100%;
  min-width: 1180px;
  border-collapse: collapse;
  font-size: 13px;
  color: #2e4058;
}

.data-modal th,
.data-modal td {
  text-align: left;
  border-bottom: 1px solid rgba(180,195,215,.35);
  vertical-align: top;
}

.data-modal th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(246, 250, 255, .98);
  color: #334a65;
  font-weight: 600;
  font-size: 12.5px;
  line-height: 1.2;
  white-space: nowrap;
  padding: 8px 10px;
  backdrop-filter: none;
}

.data-modal td {
  background: rgba(255,255,255,.95);
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: break-word;
  word-break: break-word;
}

/* Column widths (fixed layout) */
.data-modal th:nth-child(1), .data-modal td:nth-child(1) { width: 14%; }
.data-modal th:nth-child(2), .data-modal td:nth-child(2) { width: 18%; }
.data-modal th:nth-child(3), .data-modal td:nth-child(3) { width: 19%; }

.data-modal th:nth-child(4), .data-modal td:nth-child(4) {
  width: 12%;
  /* allow wrapping - reuse "复用方式" column has long text */
}

.data-modal th:nth-child(5), .data-modal td:nth-child(5) {
  width: 7%;
  white-space: nowrap;
  text-align: center;
}

.data-modal th:nth-child(6), .data-modal td:nth-child(6) { width: 15%; }
.data-modal th:nth-child(7), .data-modal td:nth-child(7) { width: 15%; }

.modal-action {
  border: 0; background: rgba(31,46,70,.06); padding: 5px 14px; font-size: 12.5px;
  color: var(--graphite); cursor: pointer; border-radius: 6px;
}
.modal-action:hover { background: rgba(31,46,70,.12); }

@media (max-width: 640px) {
  .module-modal, .data-modal {
    width: 100%; max-height: 100%; border-radius: 20px 20px 0 0;
    top: auto; bottom: 0; transform: translate(-50%, 0);
  }
  .io-row { grid-template-columns: 1fr; }
  .sequence-top { align-items: flex-start; flex-direction: column; }
  .sequence-hint { white-space: normal; }
  .sequence-detail-grid { grid-template-columns: 1fr; }
  .sequence-detail-head { align-items: flex-start; flex-direction: column; }
  .sequence-detail-modules { justify-content: flex-start; }
  .modules-section { padding: 20px 16px 32px; }
}
</style>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"></div>
<div class="brand-page">
  <nav class="top-nav" aria-label="Primary">
    <div class="brand-mark">Capability Map</div>
    <div class="nav-links">
      <button type="button" data-scroll-target="overview">Overview</button>
      <button type="button" data-scroll-target="sequence">Sequence</button>
      <button type="button" data-scroll-target="modules">Modules</button>
      <button type="button" data-open-data="reuse">Reuse</button>
    </div>
    <button class="nav-cta" type="button" data-open-data="mapping">Mapping</button>
  </nav>

  <main id="overview" class="hero">
    <div class="hero-content">
      <p class="eyebrow">GAP Analysis Agent · Capability Map</p>
      <h1>模块化功能职责重构</h1>
      <div class="hero-actions">
        <button class="hero-action" type="button" data-open-first>Explore Modules</button>
        <button class="hero-action secondary" type="button" data-open-data="mapping">View Mapping</button>
      </div>
    </div>
  </main>

  <section id="sequence" class="sequence-section">
    <div class="sequence-shell">
      <div class="sequence-top">
        <div>
          <h2>端到端时序图</h2>
          <p>按系统运行顺序展示数据、判断、人工确认、会话和交付快照如何流转。</p>
        </div>
        <div class="sequence-hint">点击节点展开</div>
      </div>
      <div class="sequence-scroll">
        <div class="sequence-track" id="sequenceTrack"></div>
      </div>
      <div class="sequence-detail" id="sequenceDetail"></div>
      <div class="sequence-note">重点边界：M09 写入 AI 初评和 messages；M10 允许 AI 工具改表，但只能进入 Draft；M12 只导出已 Accept 的正式 Risk table。</div>
    </div>
  </section>

  <section id="modules" class="modules-section">
    <div class="section-head">
      <p class="cloud-label">Core Modules</p>
      <p class="section-desc">12 个核心能力模块 · 点击卡片展开职责、输入输出、复用边界与原报价项映射</p>
    </div>
    <div class="module-grid" id="lightModulePills"></div>
  </section>
</div>

<!-- Single backdrop for all overlays -->
<div class="backdrop" id="backdrop"></div>

<!-- Module centered glass modal -->
<div class="modal module-modal" id="moduleModal" aria-live="polite">
  <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
  <div class="modal-head">
    <div class="modal-kicker">
      <span id="modalType"></span>
      <span id="modalId"></span>
    </div>
    <h2 id="modalTitle"></h2>
    <p class="purpose" id="modalPurpose"></p>
  </div>
  <div class="modal-tabs">
    <button class="modal-tab active" data-tab="duties" type="button">职责</button>
    <button class="modal-tab" data-tab="functions" type="button">功能</button>
    <button class="modal-tab" data-tab="io" type="button">输入输出</button>
    <button class="modal-tab" data-tab="links" type="button">衔接</button>
    <button class="modal-tab" data-tab="quote" type="button">报价项</button>
    <button class="modal-tab" data-tab="reuse" type="button">复用边界</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<!-- Data (Mapping / Reuse) centered modal -->
<section class="modal data-modal" id="dataModal" aria-live="polite">
  <div class="data-head">
    <h2 id="dataTitle">原报价项映射</h2>
    <div class="data-tabs">
      <button class="modal-action" type="button" data-open-data="mapping">Mapping</button>
      <button class="modal-action" type="button" data-open-data="reuse">Reuse</button>
      <button class="modal-action" type="button" data-close>关闭</button>
    </div>
  </div>
  <div class="table-area">
    <table id="lightDataTable"></table>
  </div>
</section>
<script>
const modules = [
  {
    id:"M01",
    name:"基础平台与药明账号项目工作台",
    type:"底层基础能力",

const state = {
  activeModule: null,
  activeTab: "duties",

};

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function moduleName(id) {
  const m = byId[id];
  return m ? (id + " " + m.name) : id;
}

function renderPills() {
  const root = document.getElementById("lightModulePills");
  root.innerHTML = modules.map(m => {
    const active = state.activeModule === m.id ? "active" : "";
    const disp = pillShort[m.id] || { short: m.name, desc: m.type };
    return `<button class="module-pill ${active}" data-module="${esc(m.id)}" type="button">
      <small>${esc(m.id)} · ${esc(m.layer)}</small>
      <b>${esc(disp.short)}</b>
      <span>${esc(disp.desc)}</span>
    </button>`;
  }).join("");
}

function renderSequence() {
  const root = document.getElementById("sequenceTrack");
  if (!root) return;
  const detail = document.getElementById("sequenceDetail");
  root.innerHTML = sequence.map(step => `
    <button class="sequence-step ${state.activeSequence === step.no ? "active" : ""}" data-sequence="${esc(step.no)}" type="button">
      <span class="sequence-no">${esc(step.no)}</span>
      <span class="sequence-title">${esc(step.title)}</span>
    </button>
  `).join("");
  if (!detail) return;
  const active = sequence.find(step => step.no === state.activeSequence);
  if (!active) {
    detail.classList.remove("open");
    detail.innerHTML = "";
    return;
  }
  detail.classList.add("open");
  detail.innerHTML = `
    <div class="sequence-detail-head">
      <h3>${esc(active.no)} · ${esc(active.title)}</h3>
      <div class="sequence-detail-modules">
        ${active.modules.map(id => `<span>${esc(moduleName(id))}</span>`).join("")}
      </div>
    </div>
    <div class="sequence-detail-grid">
      <p><em>输入</em>${esc(active.input)}</p>
      <p><em>动作</em>${esc(active.action)}</p>
      <p><em>输出</em>${esc(active.output)}</p>
    </div>
  `;
}

function shortPurpose(m) {
  // Use purpose + first sentence of responsibilities for summary
  return m.purpose;
}

function renderModuleModal() {
  const m = byId[state.activeModule];
  if (!m) return;

  // header
  document.getElementById("modalId").textContent = m.id;
  document.getElementById("modalType").textContent = m.type;
  document.getElementById("modalTitle").textContent = m.name;
  document.getElementById("modalPurpose").textContent = shortPurpose(m);

  // tabs active state
  document.querySelectorAll(".modal-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === state.activeTab);
  });

  const body = document.getElementById("modalBody");
  let html = "";

  if (state.activeTab === "duties") {
    // Light summary: location + one-line responsibility + top 3 functions
    const topFuncs = m.functions.slice(0, 3);
    html = `
      <div>
        <h3>模块定位</h3>
        <p><strong>${esc(m.layer)} · ${esc(m.type)}</strong></p>
      </div>
      <div>
        <h3>核心职责</h3>
        <p>${esc(m.responsibilities)}</p>
      </div>
      <div>
        <h3>关键功能</h3>
        <div class="key-functions">
          ${topFuncs.map(f => `<span>${esc(f)}</span>`).join("")}
        </div>
        <p style="margin-top:8px;font-size:12px;opacity:.6">更多功能请切换「功能」标签</p>
      </div>
    `;
  } else if (state.activeTab === "functions") {
    html = `<div><h3>全部功能</h3><div class="full-list">${m.functions.map(f => `<span>${esc(f)}</span>`).join("")}</div></div>`;
  } else if (state.activeTab === "io") {
    html = `
      <div class="io-row">
        <div><h3>输入</h3>${renderPillsList(m.input)}</div>
        <div><h3>输出</h3>${renderPillsList(m.output)}</div>
      </div>`;
  } else if (state.activeTab === "links") {
    html = `
      <div><h3>前置依赖</h3>${renderPillsList(m.deps)}</div>
      <div style="margin-top:14px"><h3>后续衔接</h3>${renderPillsList(m.next)}</div>`;
  } else if (state.activeTab === "quote") {
    html = `
      <div><h3>对应原报价项</h3><p>${esc(m.quote)}</p></div>
      <div><h3>跨模块说明</h3><p>${esc(m.cross)}</p></div>
      <div><h3>边界备注</h3><p>${esc(m.note)}</p></div>`;
  } else {
    html = `
      <div><h3>可复用能力</h3><p>${esc(m.reuse)}</p></div>
      <div><h3>边界说明</h3><p>${esc(m.note)}</p></div>`;
  }

  body.innerHTML = html;
}

function renderPillsList(items) {
  if (!items || !items.length) {
    return '<div class="pill-wrap"><span class="light-pill">无</span></div>';
  }
  return `<div class="pill-wrap">${items.map(i => `<span class="light-pill">${esc(moduleName(i))}</span>`).join("")}</div>`;
}

function closeAllOverlays() {
  state.activeOverlay = null;
  document.getElementById("backdrop").classList.remove("open");
  document.getElementById("moduleModal").classList.remove("open");
  document.getElementById("dataModal").classList.remove("open");
}

function openModule(id) {
  closeAllOverlays();
  state.activeModule = id || state.activeModule || modules[0].id;
  state.activeTab = "duties";
  state.activeOverlay = "module";

  renderPills();
  renderModuleModal();

  const backdrop = document.getElementById("backdrop");
  const modal = document.getElementById("moduleModal");
  backdrop.classList.add("open");
  modal.classList.add("open");
}

function openData(type) {
  // If the data modal is already open, just switch the content without full close
  const dataModal = document.getElementById("dataModal");
  const backdrop = document.getElementById("backdrop");
  const isAlreadyOpen = dataModal.classList.contains("open");

  if (!isAlreadyOpen) {
    closeAllOverlays();
  }

  state.activeOverlay = type;

  const isReuse = type === "reuse";
  const title = isReuse ? "跨模块复用能力" : "原报价项映射";
  document.getElementById("dataTitle").textContent = title;

  const headers = isReuse
    ? ["复用能力", "首次建设", "被复用模块", "复用方式", "易重复理解", "说明"]
    : ["原报价项", "原描述摘要", "新归属模块", "处理方式", "跨模块", "跨到模块", "说明"];

  const rows = isReuse ? reuse : mapping;

  renderTable(headers, rows);

  backdrop.classList.add("open");
  dataModal.classList.add("open");
}

function renderTable(headers, rows) {
  const thead = `<thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>`;
  const tbody = `<tbody>${rows.map(row => 
    `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`
  ).join("")}</tbody>`;
  document.getElementById("lightDataTable").innerHTML = thead + tbody;
}

function handleTabClick(tabEl) {
  if (!state.activeModule) return;
  state.activeTab = tabEl.dataset.tab;
  renderModuleModal();
}

// Event handling - clean and strict
function setupEvents() {
  const backdrop = document.getElementById("backdrop");
  const moduleModal = document.getElementById("moduleModal");
  const dataModal = document.getElementById("dataModal");

  // Module pills (delegated)
  document.getElementById("lightModulePills").addEventListener("click", e => {
    const pill = e.target.closest("[data-module]");
    if (pill) {
      openModule(pill.dataset.module);
    }
  });

  const sequenceTrack = document.getElementById("sequenceTrack");
  if (sequenceTrack) {
    sequenceTrack.addEventListener("click", e => {
      const step = e.target.closest("[data-sequence]");
      if (step) {
        state.activeSequence = state.activeSequence === step.dataset.sequence ? null : step.dataset.sequence;
        renderSequence();
      }
    });
  }

  // Open first / explore
  document.addEventListener("click", e => {
    if (e.target.closest("[data-open-first]")) {
      openModule(modules[0].id);
      return;
    }
  });

  // Data buttons (Mapping / Reuse switches) - handle both nav and inside modal
  document.addEventListener("click", e => {
    const dataBtn = e.target.closest("[data-open-data]");
    if (dataBtn) {
      const type = dataBtn.dataset.openData;
      openData(type);
      return;
    }
  });

  // Also listen directly on dataModal for its internal switch/close buttons
  dataModal.addEventListener("click", e => {
    const dataBtn = e.target.closest("[data-open-data]");
    if (dataBtn) {
      const type = dataBtn.dataset.openData;
      openData(type);
      return;
    }
  });

  // Tab switching inside module modal (only affect content)
  moduleModal.addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      handleTabClick(tab);
    }
  });

  // Close buttons - handle the × and "关闭" buttons
  // Attach directly to the modals for reliability + also catch from document for nav if needed
  const handleClose = (e) => {
    if (e.target.closest("[data-close]")) {
      closeAllOverlays();
    }
  };

  document.addEventListener("click", handleClose);
  moduleModal.addEventListener("click", handleClose);
  dataModal.addEventListener("click", handleClose);

  // Strict backdrop close — only when clicking the backdrop itself
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) {
      closeAllOverlays();
    }
  });

  // Scroll only for nav
  document.addEventListener("click", e => {
    const scrollBtn = e.target.closest("[data-scroll-target]");
    if (scrollBtn) {
      const targetId = scrollBtn.dataset.scrollTarget;
      const el = document.getElementById(targetId);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });

  // ESC key
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeAllOverlays();
    }
  });

  // Note: No stopPropagation needed.
  // Backdrop listener checks `e.target === backdrop` directly,
  // and internal buttons are handled via document delegation.
}

// Initial render
function init() {
  renderSequence();
  renderPills();
  setupEvents();
  // DO NOT auto open anything on load
}

init();
</script>
</body>
</html>
